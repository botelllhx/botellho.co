<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="text/javascript">
    // Decoder do fallback SPA (tecnica spa-github-pages): restaura a rota
    // codificada pelo 404.html antes do React Router assumir.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>

  <meta name="author" content="botellho" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Ban 1-bit (scripts/gen-favicon.mjs). O .ico leva arte propria por tamanho
       (16 desenhado, 32/48 vindos da logo), entao NAO ha favicon.svg: o
       navegador prefere o svg ao ico e uma arte so anularia esse ganho.
       O ?v e cache-busting: favicon fica cacheado por meses sem isso. -->
  <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />

  <!-- Tags globais e constantes. Titulo, description, canonical e OG por rota
       sao definidos via <Head> em cada pagina (react-helmet-async). -->
  <meta property="og:site_name" content="botellho" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@botellho_co" />
  <meta name="twitter:creator" content="@botellho_co" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "botellho",
      "url": "https://botellho.com",
      "logo": "https://botellho.com/apple-touch-icon.png",
      "image": "https://botellho.com/og-image.jpg",
      "description": "Estúdio brasileiro de web e experiências digitais. Sites, WebGL, 3D interativo e motion para marcas, cultura e instituições.",
      "email": "contato@botellho.com",
      "areaServed": "BR",
      "knowsAbout": ["desenvolvimento web", "experiências digitais", "WebGL", "3D interativo", "motion design", "direção de arte digital", "sites institucionais", "marcas e lançamentos", "cultura e instituições", "eventos e experiências"],
      "sameAs": ["https://instagram.com/botellho.co"]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
