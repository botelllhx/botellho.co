<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="text/javascript">
    // Decoder do fallback SPA (tecnica spa-github-pages): restaura a rota
    // codificada pelo 404.html antes do React Router assumir.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>

  <meta name="author" content="botellho" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Tags globais e constantes. Titulo, description, canonical e OG por rota
       sao definidos via <Head> em cada pagina (react-helmet-async). -->
  <meta property="og:site_name" content="botellho" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@botellho_co" />
  <meta name="twitter:creator" content="@botellho_co" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
